<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Rubrica</title>
  <link rel="stylesheet" href="src/style.css">
</head>

<body>
  <div class="container">
    <h1>Rubrica Contatti</h1>

    <input id="name" placeholder="Nome">
    <input id="phone" placeholder="Telefono">

    <select id="type">
      <option value="cellulare">Cellulare</option>
      <option value="fisso">Fisso</option>
    </select>

    <input id="appointment" type="datetime-local" placeholder="Appuntamento">

    <button id="addBtn">Aggiungi il contatto</button>

    <h2>Contatti:</h2>
    <div id="list"></div>
  </div>

  <script src="src/main.js"></script>
</body>
</html>
